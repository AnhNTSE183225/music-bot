name: Deploy to Linux Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Server via SSH
        env:
          ENV_SECRET: ${{ secrets.ENV }}
        run: |
          # 1. Parse SSH credentials from the ENV secret
          SSH_HOST=$(echo "$ENV_SECRET" | grep -E '^SSH_HOST=' | head -n1 | cut -d '=' -f2- | tr -d '\r' | xargs)
          SSH_USER=$(echo "$ENV_SECRET" | grep -E '^SSH_USER=' | head -n1 | cut -d '=' -f2- | tr -d '\r' | xargs)
          SSH_PASSWORD=$(echo "$ENV_SECRET" | grep -E '^SSH_PASSWORD=' | head -n1 | cut -d '=' -f2- | tr -d '\r' | xargs)
          SSH_PORT=$(echo "$ENV_SECRET" | grep -E '^SSH_PORT=' | head -n1 | cut -d '=' -f2- | tr -d '\r' | xargs)

          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST not found in secret ENV!"
            exit 1
          fi

          if [ -z "$SSH_USER" ]; then
            echo "ERROR: SSH_USER not found in secret ENV!"
            exit 1
          fi

          if [ -z "$SSH_PASSWORD" ]; then
            echo "ERROR: SSH_PASSWORD not found in secret ENV!"
            exit 1
          fi

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          echo "SSH configuration validated successfully."

          # 2. Install sshpass
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # 3. Create cleaned .env file for the application on runner
          echo "$ENV_SECRET" | tr -d '\r' | grep -v -E '^SSH_(HOST|USER|PASSWORD|PORT)=' > app.env

          # 4. Copy app.env to the server
          SSHPASS="$SSH_PASSWORD" sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$SSH_PORT" app.env "$SSH_USER@$SSH_HOST:~/workspace/music-bot/.env.new"

          # 5. Execute deployment commands remotely over SSH
          SSHPASS="$SSH_PASSWORD" sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            echo '=== Starting Automated Deployment on Server ==='
            cd ~/workspace/music-bot || { echo 'Directory ~/workspace/music-bot not found!'; exit 1; }

            echo '1. Cleaning local changes & hard-resetting to origin/main...'
            git fetch origin main
            git clean -df
            git reset --hard origin/main

            echo '2. Wiping old .env and activating fresh configuration...'
            [ -f .env ] && cp -f .env .env.bak || true
            rm -f .env
            mv -f .env.new .env

            echo '3. Stopping old services...'
            ./stop-linux.sh || true
            pkill -f 'python.*bot.py' || true

            echo '4. Starting services...'
            ./start-linux.sh

            echo '=== Deployment Succeeded! ==='
          "
